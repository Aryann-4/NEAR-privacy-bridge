<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Test</title>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement('div', { style: { padding: '40px', background: '#0f172a', color: '#fff', fontFamily: 'sans-serif' } },
            React.createElement('h1', { style: { color: '#f59e0b', fontSize: '48px' } }, 'NEAR→Midnight Privacy Bridge'),
            React.createElement('button', { style: { padding: '12px 24px', background: '#f59e0b', color: '#0f172a', border: 'none', borderRadius: '8px', fontWeight: 'bold' } }, 'Connect Wallet')
        ));
    </script>
</body>
</html>
